services:
  - type: web
    name: rendezvous-server
    runtime: node
    plan: free
    buildCommand: rm -rf server/node_modules && npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
